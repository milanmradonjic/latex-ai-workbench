name: Workbench Python compatibility
# No path filter: the five jobs below are required checks, and a required check that a filter skips would leave a pull request waiting for it forever.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on a pull request cancels the run it makes obsolete; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on every run. The repository is public, so runs are not metered; testing only the oldest and the newest on a pull request let a
        # failure in 3.12 through two merges to main.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python == '3.12'
        with:
          node-version: '24'
      - name: Prepare the pinned Gemini CLI policy validator
        if: matrix.python == '3.12'
        run: |
          policy_utils="$RUNNER_TEMP/gemini-policy-v0.69.0.ts"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://raw.githubusercontent.com/google-gemini/gemini-cli/58840eb92ebf1474193a05817c34a74820bd444a/packages/core/src/policy/utils.ts \
            --output "$policy_utils"
          printf '54ff4f89b9801df45f923cbc7dbb3f7b015b491c49486f0831fb8c9ebaf61de5  %s\n' "$policy_utils" | sha256sum --check
          printf 'WORKBENCH_GEMINI_UTILS=%s\n' "$policy_utils" >> "$GITHUB_ENV"
      - name: Test distribution and reference parity
        run: make -C workbench test
