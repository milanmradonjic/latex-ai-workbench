name: Workbench Python compatibility
on:
  push:
    branches: [main]
    paths:
      - 'workbench/**'
      - '.latex-ai/**'
      - '.github/workflows/workbench-python.yml'
  pull_request:
    paths:
      - 'workbench/**'
      - '.latex-ai/**'
      - '.github/workflows/workbench-python.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on a pull request cancels the run it makes obsolete; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on every run. The repository is public, so runs are not metered; testing only the oldest and the newest on a pull request let a
        # failure in 3.12 through two merges to main.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test distribution and reference parity
        run: make -C workbench test
