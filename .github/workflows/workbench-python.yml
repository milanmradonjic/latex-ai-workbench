name: Workbench Python compatibility
# No path filter: the five jobs below are required checks, and a required check that a filter skips would leave a pull request waiting for it forever.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on a pull request cancels the run it makes obsolete; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on every run. The repository is public, so runs are not metered; testing only the oldest and the newest on a pull request let a
        # failure in 3.12 through two merges to main.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test distribution and reference parity
        run: make -C workbench test
