name: LaTeX AI Workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on a pull request cancels the run it makes obsolete; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LATEX_AI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check changed files and policy
        run: python3 -B .latex-ai/workbench.py validate --files-only
      - name: Test compiler portability, then check the reference manuscript
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            apt-get update -qq
            apt-get install -y --no-install-recommends python3 make
            make -C workbench portability
            make check
